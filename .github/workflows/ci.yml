name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test publication safety checks
        run: python3 scripts/test_public_release.py
      - name: Check public source hygiene
        run: python3 scripts/check_public_release.py
      - name: Show toolchain
        run: swift --version
      - name: Validate shell scripts
        run: for script in scripts/*.sh; do bash -n "$script"; done
      - name: Test and package without an account
        # No account, login, diagnostic, installed app, or reset is used by this job.
        run: ./scripts/native_release_check.sh --skip-previews
