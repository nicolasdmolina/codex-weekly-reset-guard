name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify the Mac app and source
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      sums_sha256: ${{ steps.package.outputs.sums_sha256 }}
    steps:
      - name: Check out the tag
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Match the tag to the app version, changelog and commit
        run: |
          version="$(plutil -extract CFBundleShortVersionString raw -o - Resources/Info.plist)"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            printf '::error::Tag %s does not match Resources/Info.plist version %s.\n' "$GITHUB_REF_NAME" "$version"
            exit 1
          fi
          if ! grep -Eq "^## ${version//./\\.}( |$)" CHANGELOG.md; then
            printf '::error::CHANGELOG.md has no "## %s" section for the release notes.\n' "$version"
            exit 1
          fi
          # Provenance records GITHUB_SHA as the source digest; it must be the tagged commit.
          if [[ "$GITHUB_SHA" != "$(git rev-parse "$GITHUB_REF^{commit}")" ]]; then
            printf '::error::GITHUB_SHA is not the commit %s points to. Push a lightweight tag.\n' "$GITHUB_REF_NAME"
            exit 1
          fi
      - name: Test publication safety checks
        run: python3 scripts/test_public_release.py
      - name: Check public source hygiene
        run: python3 scripts/check_public_release.py
      - name: Test and package without an account
        run: ./scripts/native_release_check.sh --skip-previews
      - name: Build both archives from the tagged sources
        id: package
        run: |
          directory="$(./scripts/package_release.sh --tag "$GITHUB_REF_NAME")"
          printf 'directory=%s\n' "$directory" >> "$GITHUB_OUTPUT"
          printf 'sums_sha256=%s\n' "$(shasum -a 256 "$directory/SHA256SUMS" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Attest the app ZIP and the source ZIP
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.directory }}/*.zip
      - name: Verify the finished downloads and their provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DIRECTORY: ${{ steps.package.outputs.directory }}
        run: |
          ./scripts/verify_release.sh --tag "$GITHUB_REF_NAME" --dir "$RELEASE_DIRECTORY" \
            --source-commit "$GITHUB_SHA" --self-test
      - name: Keep the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: ${{ steps.package.outputs.directory }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Draft the GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the tag
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Collect the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: ${{ runner.temp }}/assets
      - name: Check the files and create the draft
        env:
          ASSETS: ${{ runner.temp }}/assets
          EXPECTED_SUMS: ${{ needs.build.outputs.sums_sha256 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          app="Second-Wind-$version-mac.zip"
          source="Second-Wind-$version-source.zip"
          notes="$RUNNER_TEMP/release-notes.md"
          awk -v version="$version" '/^## / { active = ($2 == version); next } active' CHANGELOG.md > "$notes"
          cd "$ASSETS"
          test "$(ls -A | sort)" = "$(printf '%s\n' SHA256SUMS "$app" "$source" | sort)"
          printf '%s  SHA256SUMS\n' "$EXPECTED_SUMS" | sha256sum --check --strict
          sha256sum --check --strict SHA256SUMS
          {
            printf '\n## Install on a Mac\n\n'
            printf 'Download **%s**, unzip it, and move **Second Wind.app** to Applications. If you already use Second Wind, quit it and replace your existing copy. Works on Apple silicon and Intel with macOS 14 or later.\n\n' "$app"
            printf 'Apple has not notarized this build. If macOS reports that the developer cannot be verified, you can approve this specific app after confirming the download. [Apple’s first-open instructions](https://support.apple.com/en-us/102445).\n\n'
            printf 'The source is **%s**. GitHub recorded the origin of both archives at commit `%s`.\n\n' "$source" "$GITHUB_SHA"
            printf '```\n'; cat SHA256SUMS; printf '```\n'
          } >> "$notes"
          gh release create "$GITHUB_REF_NAME" "$app" "$source" SHA256SUMS --repo "$GITHUB_REPOSITORY" \
            --draft --verify-tag --title "Second Wind $version" --notes-file "$notes"
