name: Release

# A version tag that matches Resources/Info.plist builds a draft GitHub release.
# The source archive always ships, with a SHA-256 checksum and GitHub build
# provenance. The app disk image builds only when the repository variable
# SECOND_WIND_SIGNED_DMG is "true", and then only Developer ID signed, notarized,
# stapled and Gatekeeper-verified; there is no unsigned fallback. The maintainer
# reviews and publishes the draft. See docs/RELEASING.md.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    name: Test and archive the source
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - name: Check out the tag
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Match the tag to the app version and commit
        run: |
          version="$(plutil -extract CFBundleShortVersionString raw -o - Resources/Info.plist)"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            printf '::error::Tag %s does not match Resources/Info.plist version %s.\n' "$GITHUB_REF_NAME" "$version"
            exit 1
          fi
          # Provenance records GITHUB_SHA as the source digest; it must be the tagged commit.
          if [[ "$GITHUB_SHA" != "$(git rev-parse "$GITHUB_REF^{commit}")" ]]; then
            printf '::error::GITHUB_SHA is not the commit %s points to. Push a lightweight tag.\n' "$GITHUB_REF_NAME"
            exit 1
          fi
      - name: Test publication safety checks
        run: python3 scripts/test_public_release.py
      - name: Check public source hygiene
        run: python3 scripts/check_public_release.py
      - name: Test and package without an account
        run: ./scripts/native_release_check.sh --skip-previews
      - name: Archive the tagged source
        id: package
        run: |
          path="$(./scripts/package_source.sh --tag "$GITHUB_REF_NAME")"
          printf 'path=%s\n' "$path" >> "$GITHUB_OUTPUT"
          printf 'sha256=%s\n' "$(shasum -a 256 "$path" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Record build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.path }}
      - name: Verify the archive and its provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/verify_release.sh --tag "$GITHUB_REF_NAME" --dir "dist/release/$GITHUB_REF_NAME" \
            --source-commit "$GITHUB_SHA"
      - name: Keep the archive for the release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          retention-days: 7

  app:
    name: Sign and notarize the app
    needs: source
    if: vars.SECOND_WIND_SIGNED_DMG == 'true'
    runs-on: macos-15
    timeout-minutes: 90
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      sha256: ${{ steps.build.outputs.sha256 }}
    steps:
      - name: Check out the tag
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Require the complete signing configuration
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          SECOND_WIND_TEAM_ID: ${{ vars.SECOND_WIND_TEAM_ID }}
        run: |
          missing=()
          for name in DEVELOPER_ID_P12_BASE64 DEVELOPER_ID_P12_PASSWORD NOTARY_KEY_P8_BASE64 \
              NOTARY_KEY_ID NOTARY_ISSUER_ID SECOND_WIND_TEAM_ID; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} )); then
            printf '::error::SECOND_WIND_SIGNED_DMG is true, but the release environment lacks: %s\n' "${missing[*]}"
            exit 1
          fi
      - name: Load the Developer ID certificate and notary key
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          umask 077
          signing="$RUNNER_TEMP/signing"
          keychain="$signing/release.keychain-db"
          mkdir -p "$signing"
          keychain_password="$(openssl rand -base64 32)"
          printf '::add-mask::%s\n' "$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$signing/developer-id.p12"
          security import "$signing/developer-id.p12" -k "$keychain" -f pkcs12 \
            -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign >/dev/null
          rm -f "$signing/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          printf '%s' "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$signing/notary.p8"
          printf 'SECOND_WIND_KEYCHAIN=%s\n' "$keychain" >> "$GITHUB_ENV"
          printf 'SECOND_WIND_NOTARY_KEY_PATH=%s\n' "$signing/notary.p8" >> "$GITHUB_ENV"
      - name: Build, sign, notarize and staple
        id: build
        env:
          SECOND_WIND_TEAM_ID: ${{ vars.SECOND_WIND_TEAM_ID }}
          SECOND_WIND_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          SECOND_WIND_NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          path="$(./scripts/release_dmg.sh --tag "$GITHUB_REF_NAME")"
          printf 'path=%s\n' "$path" >> "$GITHUB_OUTPUT"
          printf 'sha256=%s\n' "$(shasum -a 256 "$path" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Record build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.build.outputs.path }}
      - name: Verify like a downloader and run the app
        env:
          GH_TOKEN: ${{ github.token }}
          SECOND_WIND_TEAM_ID: ${{ vars.SECOND_WIND_TEAM_ID }}
        run: |
          ./scripts/verify_release.sh --tag "$GITHUB_REF_NAME" --dir "dist/release/$GITHUB_REF_NAME" \
            --team-id "$SECOND_WIND_TEAM_ID" --source-commit "$GITHUB_SHA" --self-test
      - name: Keep the disk image for the release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app
          path: ${{ steps.build.outputs.path }}
          if-no-files-found: error
          retention-days: 7
      - name: Remove signing material
        if: always()
        run: |
          if [[ -n "${SECOND_WIND_KEYCHAIN:-}" ]]; then
            security delete-keychain "$SECOND_WIND_KEYCHAIN" || true
          fi
          rm -rf "$RUNNER_TEMP/signing"

  publish:
    name: Draft the GitHub release
    needs: [source, app]
    if: >-
      ${{ !cancelled() && needs.source.result == 'success' &&
      (needs.app.result == 'success' || needs.app.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the tag
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Collect the verified files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/assets
          merge-multiple: true
      - name: Check the files and write SHA256SUMS
        env:
          ASSETS: ${{ runner.temp }}/assets
          SOURCE_SHA256: ${{ needs.source.outputs.sha256 }}
          APP_SHA256: ${{ needs.app.outputs.sha256 }}
          APP_RESULT: ${{ needs.app.result }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          files=("Second-Wind-$version-source.zip")
          digests=("$SOURCE_SHA256")
          if [[ "$APP_RESULT" == success ]]; then
            files+=("Second-Wind-$version.dmg")
            digests+=("$APP_SHA256")
          fi
          cd "$ASSETS"
          if [[ "$(ls -A | sort)" != "$(printf '%s\n' "${files[@]}" | sort)" ]]; then
            printf '::error::The release files are not exactly: %s\n' "${files[*]}"
            exit 1
          fi
          for index in "${!files[@]}"; do
            if [[ ! "${digests[$index]}" =~ ^[0-9a-f]{64}$ ||
                "$(sha256sum "${files[$index]}" | cut -d ' ' -f 1)" != "${digests[$index]}" ]]; then
              printf '::error::%s changed after it was verified.\n' "${files[$index]}"
              exit 1
            fi
          done
          sha256sum "${files[@]}" > SHA256SUMS
      - name: Write the release notes
        env:
          ASSETS: ${{ runner.temp }}/assets
          NOTES: ${{ runner.temp }}/notes.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            awk -v heading="## $version" \
              'index($0, heading) == 1 { found = 1; next } /^## / { found = 0 } found' CHANGELOG.md
            printf '\n## Downloads\n\n'
            if [[ -f "$ASSETS/Second-Wind-$version.dmg" ]]; then
              printf -- '- **Second-Wind-%s.dmg**: the app for Apple silicon and Intel Macs on macOS 14 or later, signed with Developer ID and notarized by Apple. Open it and drag Second Wind to Applications.\n' "$version"
            else
              printf 'This release has no ready-made app. Build it from the source archive.\n\n'
            fi
            printf -- '- **Second-Wind-%s-source.zip**: the source. Unzip it and run `./scripts/install_app.sh --launch` (needs Swift 6).\n' "$version"
            printf '\n## Verify\n\nSHA-256 checksums:\n\n```\n'
            cat "$ASSETS/SHA256SUMS"
            printf '```\n\nEvery file has GitHub build provenance from this workflow at commit %s:\n\n```sh\n' "$GITHUB_SHA"
            printf 'gh attestation verify Second-Wind-%s-source.zip --repo %s --source-digest %s\n' \
              "$version" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            printf '```\n\nFrom a checkout, `./scripts/verify_release.sh --tag %s --published` checks every file.\n' "$GITHUB_REF_NAME"
          } > "$NOTES"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          ASSETS: ${{ runner.temp }}/assets
          NOTES: ${{ runner.temp }}/notes.md
        run: |
          gh release create "$GITHUB_REF_NAME" "$ASSETS"/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Second Wind ${GITHUB_REF_NAME#v}" --notes-file "$NOTES"
