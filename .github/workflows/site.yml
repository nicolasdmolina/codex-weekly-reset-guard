name: Website

on:
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Test the release manifest parser
        run: node scripts/test-release-manifest.mjs
      - run: npm run build
      - name: Build the verified-source and app install states from fixtures
        run: |
          npx vite build --mode qa-source --outDir dist-qa-source
          npx vite build --mode qa-app --outDir dist-qa-app
      - name: Check desktop and mobile in Chrome
        run: |
          servers=()
          trap 'kill "${servers[@]}" 2>/dev/null || true' EXIT
          for build in dist:4317 dist-qa-source:4318 dist-qa-app:4319; do
            npx vite preview --outDir "${build%%:*}" --host 127.0.0.1 --port "${build##*:}" --strictPort &
            servers+=($!)
          done
          for port in 4317 4318 4319; do
            curl --retry 12 --retry-connrefused --retry-delay 1 --fail --silent \
              --output /dev/null "http://127.0.0.1:$port/"
          done
          node scripts/qa.mjs http://127.0.0.1:4317/
          node scripts/qa.mjs http://127.0.0.1:4318/ scripts/qa-release-source.json
          node scripts/qa.mjs http://127.0.0.1:4319/ scripts/qa-release-app.json
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main'
        with:
          path: site/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: publish
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
