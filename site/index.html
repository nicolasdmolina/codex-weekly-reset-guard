        <h1>Second Wind</h1>
        <p>A free, open-source Mac menu-bar app that shows your Codex and Claude usage limits for every account and helps you use a reset before you run out.</p>
        <h2>Install from source</h2>
        <p>There is no signed, ready-made download yet. You need macOS 14 or later, Swift 6 or later (from Xcode or Apple's Command Line Tools), and the official Codex CLI or app, Claude Code, or both.</p>
        <ol>
          <li><a href="https://github.com/nicolasdmolina/codex-weekly-reset-guard/archive/refs/heads/main.zip">Download the source (.zip)</a> and open it. You get a folder named <code>codex-weekly-reset-guard-main</code>.</li>
          <li>Open Terminal and run:
            <pre><code>cd ~/Downloads/codex-weekly-reset-guard-main
./scripts/install_app.sh --launch</code></pre>
          </li>
          <li>The app opens as a wind symbol in your menu bar. Pick Codex or Claude and sign in.</li>
        </ol>
        <p>Full steps are in the <a href="https://github.com/nicolasdmolina/codex-weekly-reset-guard#build-and-install">README</a>. Read the <a href="https://github.com/nicolasdmolina/codex-weekly-reset-guard/blob/main/docs/PRIVACY.md">privacy notes</a>.</p>
        <p>Second Wind is independent, open-source software. It is not made by, affiliated with or endorsed by OpenAI or Anthropic.</p>
